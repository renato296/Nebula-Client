
buildscript {
    repositories {
        maven {
            url = "https://maven.minecraftforge.net/"
        }
        mavenCentral()
    }
    dependencies {
        classpath 'net.minecraftforge.gradle:ForgeGradle:2.1-SNAPSHOT'
    }
}

apply plugin: 'net.minecraftforge.gradle.forge'

version = '0.1.0'
group = 'br.nebula.client'
archivesBaseName = 'NebulaClient'

sourceCompatibility = '1.8'
targetCompatibility = '1.8'

minecraft {
    version = '1.8.8-11.15.0.1655'
    mappings = 'stable_18'
    runDir = 'run'
}
src/main/java/
└── br/nebula/client/
    ├── config/
    │   └── NebulaConfig.java
    ├── gui/
    │   ├── ClickGuiScreen.java
    │   └── ChatSettingsScreen.java
    ├── module/
    │   ├── Module.java
    │   ├── ModuleManager.java
    │   ├── ChatControlModule.java
    │   └── HudModule.java
    └── hud/
        ├── HudRenderer.java
        └── HudEditorScreen.java
