
name: Build Nebula Client

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar arquivos do projeto
        uses: actions/checkout@v4

      - name: Instalar Java 8
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '8'

      - name: Preparar Forge 1.8.8
        run: |
          wget -O forge.zip \
            https://maven.minecraftforge.net/net/minecraftforge/forge/1.8.8-11.15.0.1655/forge-1.8.8-11.15.0.1655-mdk.zip
          mkdir forge
          unzip -q forge.zip -d forge
          cp -r src forge/
          cd forge
          chmod +x gradlew
          ./gradlew setupDecompWorkspace build --no-daemon

      - name: Guardar arquivo compilado
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: NebulaClient
          path: forge/build/libs/*.jar
          
